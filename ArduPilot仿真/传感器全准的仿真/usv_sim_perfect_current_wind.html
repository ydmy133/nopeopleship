function current() { return DATA[idx]; }

function phaseColor(p) {

  if (p === 'back_in') return '#2f7d57';
  if (p === 'exit_again') return '#7b2d8e';

  if (p === 'no_cur_in') return '#64748b';

  if (k === 'hold') return '#6b7280';
  if (k === 'exit1') return '#c05621';
  if (k === 'back') return '#2f7d57';

  if (k === 'nocur') return '#1d4ed8';

}

DATA.forEach((d, i) => {
  const b = document.createElement('button');
  b.className = 'tab' + (i===0 ? ' active' : '');
  b.innerHTML = d.title + '<span class="ok ' + (d.passed?'pass':'fail') + '">' + (d.passed?'通过':'未通过') + '</span>';
  b.onclick = () => { idx=i; cursor=1; [...tabs.children].forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderSide(); draw(); };
  tabs.appendChild(b);
});

function seekToTime(t) {
  const d = current();
  const tmax = d.t[d.t.length-1] || 1;
  cursor = Math.max(0, Math.min(1, t / tmax));
  document.getElementById('scrub').value = cursor;
  playing = false;
  draw();
}

function renderSide() {
  const d = current();
  document.getElementById('sideTitle').textContent = d.title + (d.passed ? '  · 通过' : '  · 未通过');
  document.getElementById('purpose').textContent = d.purpose;
  const m = document.getElementById('metrics');
  m.innerHTML = '';
  Object.entries(d.metrics).forEach(([k,v]) => {
    const row = document.createElement('div');
    row.className = 'metric';
    row.innerHTML = '<span>' + k + '</span><span>' + v + '</span>';
    m.appendChild(row);
  });
  const ul = document.getElementById('notes');
  ul.innerHTML = d.notes.map(n => '<li>' + n + '</li>').join('');
  const ev = document.getElementById('events');
  const events = d.events || [];
  if (!events.length) {
    ev.innerHTML = '<li class="sub">该页没有稳泊出圈节点（巡航页或未出 2 m）。</li>';
  } else {
    ev.innerHTML = events.map((e,i) =>
      '<li data-kind="'+e.kind+'" data-i="'+i+'"><span class="t">'+e.t.toFixed(1)+' s</span>'+e.text+
      '<div class="sub">导航距 '+e.nav_dist+' m · 真距 '+e.true_dist+' m · T='+e.move+' · |c|='+e.c_mag+' m/s</div></li>'
    ).join('');
    [...ev.children].forEach(li => {
      li.onclick = () => seekToTime(events[parseInt(li.dataset.i,10)].t);
    });
  }
  const decay = document.getElementById('legend-decay');
  const varies = d.env_scale && d.env_scale.some(s => s < 0.99);
  decay.style.display = varies ? 'inline' : 'none';
}

function bounds(d) {
  const pts = d.true.concat(d.gnss, d.filt, d.tgt, [[0,0]]);
  let minE=1e9,maxE=-1e9,minN=1e9,maxN=-1e9;
  pts.forEach(p => { minE=Math.min(minE,p[0]); maxE=Math.max(maxE,p[0]); minN=Math.min(minN,p[1]); maxN=Math.max(maxN,p[1]); });
  const pad = 8;
  minE-=pad; maxE+=pad; minN-=pad; maxN+=pad;
  const w = maxE-minE, h = maxN-minN;
  const span = Math.max(w,h,20);
  const cx=(minE+maxE)/2, cy=(minN+maxN)/2;
  return {minE:cx-span/2, maxE:cx+span/2, minN:cy-span/2, maxN:cy+span/2};
}

function xy(b, e, n) {
  const x = (e - b.minE) / (b.maxE - b.minE) * canvas.width;
  const y = canvas.height - (n - b.minN) / (b.maxN - b.minN) * canvas.height;
  return [x,y];
}

function strokePath(b, pts, n, color, width) {
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  for (let i=0;i<n;i++) {
    const [x,y] = xy(b, pts[i][0], pts[i][1]);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
}

function envColor(s) {
  if (s >= 0.99) return '#1f4b73';
  if (s <= 0.01) return '#2f7d57';
  return '#8a5a2b';
}

function strokeTrue(b, d, n) {
  const pts = d.true;
  const phases = d.phase;
  const holdPhases = {hold_idle:1, first_exit:1, back_in:1, exit_again:1, no_cur_out:1, no_cur_in:1};
  const hasHold = phases && phases.some(p => holdPhases[p]);
  if (hasHold) {
    for (let i = 1; i < n; i++) {
      const a = xy(b, pts[i-1][0], pts[i-1][1]);
      const c = xy(b, pts[i][0], pts[i][1]);
      ctx.beginPath();
      ctx.strokeStyle = phaseColor(phases[i]);
      ctx.lineWidth = phases[i]==='exit_again' ? 3.4 : 2.5;
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(c[0], c[1]);
      ctx.stroke();
    }
    return;
  }
  const scales = d.env_scale;
  const varies = scales && scales.some(s => s < 0.99);
  if (!varies) {
    strokePath(b, pts, n, '#1f4b73', 2.5);
    return;
  }
  for (let i = 1; i < n; i++) {
    const a = xy(b, pts[i-1][0], pts[i-1][1]);
    const c = xy(b, pts[i][0], pts[i][1]);
    ctx.beginPath();
    ctx.strokeStyle = envColor(scales[i]);
    ctx.lineWidth = 2.5;
    ctx.moveTo(a[0], a[1]);
    ctx.lineTo(c[0], c[1]);
    ctx.stroke();
  }

function drawEvents(b, d, n) {
  const events = d.events || [];
  const tNow = d.t[n-1];
  events.forEach((e, i) => {
    if (e.t > tNow + 1e-6) return;
    const [x,y] = xy(b, e.e, e.n);
    ctx.beginPath();
    ctx.fillStyle = kindColor(e.kind);
    ctx.arc(x, y, e.kind==='exit2' ? 7 : 6, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i+1), x, y);
  });
  const elist = document.getElementById('events');
  [...elist.children].forEach((li, i) => {
    if (!events[i]) return;
    li.classList.toggle('active', Math.abs(events[i].t - tNow) < 0.15 || (events[i].t <= tNow && (i===events.length-1 || events[i+1].t > tNow)));

  ctx.moveTo(bx, by);

    clock += '  环境×' + d.env_scale[n-1].toFixed(2);
  }
  if (d.c_mag && d.c_mag.length) clock += '  |c|=' + d.c_mag[n-1].toFixed(3) + ' m/s';
  document.getElementById('clock').textContent = clock;
  const live = (d.decision && d.decision[n-1]) ? d.decision[n-1] : '—';
  document.getElementById('liveDecision').textContent = live;
  drawDist(d, n);
}

document.getElementById('play').onclick = () => { playing = !playing; if (playing && cursor>=0.999) cursor=0; };
document.getElementById('scrub').oninput = (e) => { cursor = parseFloat(e.target.value); playing=false; draw(); };

function tick() {
  if (playing) {
    cursor = Math.min(1, cursor + 0.004);
    document.getElementById('scrub').value = cursor;
    if (cursor>=1) playing=false;
    draw();
  }
  requestAnimationFrame(tick);
}
renderSide();
draw();
tick();
</script>
</body>
